server {
    server_name ev98.ir;

    root /var/www/ev98;
    index index.html;
    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    location /v1/ {
        proxy_pass http://127.0.0.1:8098;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Static catalog. Must not fall through to the map app's index.html.
    location = /cars {
        return 301 /cars/;
    }

    location = /cars/ {
        add_header Cache-Control "no-cache" always;
        try_files /cars/index.html =404;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8098/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Station pages receive server-rendered metadata/schema while the React app
    # still hydrates from the same production index and asset bundle.
    location /stations/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # HTML shell/routes must revalidate after deploys. Fingerprinted assets
        # are still cached by the regex location above.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ev98.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ev98.ir/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name ev98.ir www.ev98.ir;
    return 301 https://ev98.ir$request_uri;
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name www.ev98.ir;

    ssl_certificate /etc/letsencrypt/live/ev98.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ev98.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ev98.ir$request_uri;
}
